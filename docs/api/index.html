<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="SIAM API reference for museum visitors, events, collections, incidents and reports.">
    <title>SIAM · API reference</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.34.1/swagger-ui.css">
    <style>
      body { margin: 0; color: #002337; background: #fafafa; font-family: system-ui, sans-serif; }
      header { padding: 24px max(24px, calc((100vw - 1460px) / 2)); background: #002337; color: white; }
      header p { margin: 8px 0 16px; color: #ccdbe5; }
      header a { color: white; text-underline-offset: 4px; }
      nav { display: flex; flex-wrap: wrap; gap: 12px 24px; }
      a:focus-visible { outline: 3px solid #eea54b; outline-offset: 5px; }
      h1 { margin: 0; font-size: 1.75rem; }
      .notice { max-width: 1460px; margin: 24px auto 0; padding: 0 20px; line-height: 1.6; }
      .swagger-ui .info { margin: 32px 0; }
      .swagger-ui .scheme-container { display: none; }
    </style>
  </head>
  <body>
    <header>
      <h1>SIAM · API reference</h1>
      <p>Museo Histórico Cultural Juan Santamaría</p>
      <nav aria-label="Documentation links">
        <a href="./openapi.yaml" download>Download OpenAPI</a>
        <a href="https://github.com/rgdan/siam">Project on GitHub</a>
        <a href="https://github.com/rgdan/siam/blob/main/docs/api.es.md" hreflang="es">API guide (Spanish)</a>
      </nav>
    </header>
    <p class="notice">This reference is generated from the backend on the main branch. To test requests, start SIAM and open <a href="http://127.0.0.1:8000/api/docs/">local Swagger UI</a>. GitHub Pages hosts documentation only.</p>
    <noscript><p class="notice">Enable JavaScript to browse the reference, or download the OpenAPI file above.</p></noscript>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.34.1/swagger-ui-bundle.js"></script>
    <script>
      SwaggerUIBundle({
        url: './openapi.yaml',
        dom_id: '#swagger-ui',
        presets: [SwaggerUIBundle.presets.apis],
        layout: 'BaseLayout',
        deepLinking: true,
        docExpansion: 'none',
        supportedSubmitMethods: [],
        validatorUrl: null,
      });
    </script>
  </body>
</html>
