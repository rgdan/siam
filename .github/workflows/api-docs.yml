name: API documentation

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs/api/**'
      - '.github/workflows/api-docs.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/api/**'
      - '.github/workflows/api-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: docs-build-only-not-used-by-a-running-server
      DJANGO_DB_PATH: ':memory:'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Test documentation contracts
        working-directory: backend
        run: python manage.py test api.test_schema
      - name: Generate and validate OpenAPI
        run: |
          mkdir -p _site
          python backend/manage.py spectacular --file _site/openapi.yaml --validate --fail-on-warn
          cp docs/api/index.html _site/index.html
      - name: Upload documentation site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
