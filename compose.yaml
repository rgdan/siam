services:
  backend:
    build: ./backend
    init: true
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY in the root .env file}
      DJANGO_DB_PATH: /data/db.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sqlite-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12

  frontend:
    build: ./frontend
    init: true
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite-data:
